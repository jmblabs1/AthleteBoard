<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AthleteBoard</title>
<style>
  :root{
    --green-dark:#0b3d2e;
    --green-darker:#082e22;
    --yellow:#f5c518;
    --yellow-dark:#e0b30f;
    --bg:#eef1f5;
    --card:#ffffff;
    --text:#0f172a;
    --muted:#64748b;
    --line:#e2e8f0;
    --link:#1d4ed8;
    --danger:#b91c1c;
    --sort-arrow:#c2410c;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
  }
  .wrap{ max-width:1450px; margin:0 auto; padding:0 0 24px 0; }

  /* Header */
  header.top{
    background:linear-gradient(180deg,var(--green-dark),var(--green-darker));
    padding:16px 24px;
    display:flex; align-items:center; justify-content:space-between;
    flex-wrap:wrap; gap:14px;
    border-radius:0 0 18px 18px;
    margin-bottom:18px;
  }
  header.top .brand{ display:flex; align-items:center; gap:12px; }
  header.top .mark{
    width:44px; height:44px; border-radius:10px;
    border:2px solid var(--yellow);
    display:flex; align-items:center; justify-content:center;
    color:var(--yellow); font-weight:800; font-size:16px; letter-spacing:.02em;
  }
  header.top .brand-text h1{ margin:0; font-size:21px; color:white; font-weight:800; letter-spacing:.01em; }
  header.top .brand-text .sub{ font-size:12px; color:#bcd9cc; margin-top:1px; }
  header.top .controls{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }

  .add-btn{
    border:none; border-radius:999px; padding:11px 18px;
    font-size:14px; font-weight:800; background:var(--yellow);
    color:#3a2c00; cursor:pointer; white-space:nowrap;
  }
  .add-btn:hover{ background:var(--yellow-dark); }

  .tab-pills{ display:flex; gap:4px; background:rgba(255,255,255,.08); border-radius:999px; padding:4px; }
  .tab-pill{
    border:none; background:transparent; padding:9px 16px; border-radius:999px;
    font-size:13px; font-weight:800; color:#cfe6da; cursor:pointer; white-space:nowrap;
  }
  .tab-pill.active{ background:var(--yellow); color:#3a2c00; }

  .toolbar{
    display:flex; align-items:center; justify-content:space-between;
    gap:12px; flex-wrap:wrap; padding:0 24px 14px 24px;
  }
  .search-wrap{ position:relative; flex:1; min-width:220px; max-width:420px; }
  .search-wrap input{
    width:100%; border:1px solid var(--line); border-radius:12px;
    padding:11px 14px 11px 34px; font-size:14px; background:white;
  }
  .search-wrap .icon{
    position:absolute; left:12px; top:50%; transform:translateY(-50%);
    color:var(--muted); font-size:14px; pointer-events:none;
  }
  .toolbar .count{ font-size:13px; color:var(--muted); white-space:nowrap; }
  .toolbar .actions{ display:flex; gap:8px; flex-wrap:wrap; }
  .secondary{
    border:1px solid var(--line); background:white; color:var(--text);
    border-radius:12px; padding:9px 13px; cursor:pointer; font-weight:600; font-size:13px;
  }
  .secondary:hover{ background:#f8fafc; }

  .card{
    background:var(--card); border:1px solid var(--line); border-radius:18px;
    margin:0 24px; box-shadow:0 8px 24px rgba(15,23,42,.05); overflow:hidden;
  }
  .table-wrap{ overflow-x:auto; }
  table{ width:100%; border-collapse:collapse; min-width:1080px; }
  th, td{
    padding:14px 12px; text-align:left; border-bottom:1px solid var(--line);
    white-space:nowrap; font-size:14px;
  }
  th{
    background:white; color:#94a3b8; font-size:11px; font-weight:800;
    letter-spacing:.05em; text-transform:uppercase; cursor:pointer; user-select:none;
    border-bottom:2px solid var(--line);
  }
  th.no-sort{ cursor:default; }
  th .arrow{ color:var(--sort-arrow); margin-left:3px; font-size:10px; }
  th:not(.no-sort):hover{ color:#475569; }
  th.sorted{ color:#1e293b; }
  tbody tr{ background:white; }
  td.name-cell a.player-link{
    color:var(--link); text-decoration:underline; cursor:pointer; font-weight:700;
  }
  td.name-cell a.player-link:hover{ color:#1e3a8a; }
  td.stat-primary{ font-weight:800; }
  .unfollow-btn{
    border:1px solid #f3c9c9; background:white; color:var(--danger);
    border-radius:10px; padding:7px 14px; font-size:12px; font-weight:700; cursor:pointer;
  }
  .unfollow-btn:hover{ background:#fff5f5; }
  .empty-state{ padding:48px 24px; text-align:center; color:var(--muted); }
  .empty-state .big{ font-size:16px; font-weight:700; color:var(--text); margin-bottom:6px; }
  .empty-state .add-btn{ margin-top:14px; }

  /* Modal */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(15,23,42,.5);
    display:none; align-items:flex-start; justify-content:center;
    padding:40px 16px; overflow-y:auto; z-index:50;
  }
  .modal-overlay.open{ display:flex; }
  .modal{
    background:white; border-radius:20px; max-width:600px; width:100%;
    box-shadow:0 20px 60px rgba(15,23,42,.25);
  }
  .modal-head{
    padding:20px 22px; border-bottom:1px solid var(--line);
    display:flex; align-items:flex-start; justify-content:space-between; gap:10px;
  }
  .modal-head h2{ margin:0 0 4px 0; font-size:19px; }
  .modal-head .sub{ font-size:13px; color:var(--muted); }
  .modal-close{
    border:none; background:#f1f5f9; border-radius:10px;
    width:32px; height:32px; cursor:pointer; font-size:16px; color:var(--muted); flex-shrink:0;
  }
  .modal-body{ padding:20px 22px; max-height:65vh; overflow-y:auto; }
  .modal-foot{ padding:16px 22px; border-top:1px solid var(--line); display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:13px; font-weight:700; margin-bottom:6px; color:#334155; }
  .field input, .field textarea{
    width:100%; border:1px solid var(--line); border-radius:12px;
    padding:11px 13px; font-size:14px; background:white; font-family:inherit;
  }
  .field .hint{ font-size:12px; color:var(--muted); margin-top:5px; line-height:1.4; }
  .stat-section{ margin-bottom:18px; }
  .stat-section h3{
    font-size:12px; text-transform:uppercase; letter-spacing:.04em;
    color:var(--muted); margin:0 0 10px 0; padding-bottom:6px; border-bottom:1px solid var(--line);
  }
  .stat-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(85px,1fr)); gap:8px; }
  .stat-grid .stat-field label{ font-size:11px; margin-bottom:3px; }
  .stat-grid .stat-field input{ padding:8px 9px; font-size:13px; }
  .chooser-list{ display:grid; gap:8px; margin-top:10px; }
  .chooser-row{
    display:flex; align-items:center; gap:10px; border:1px solid var(--line);
    border-radius:12px; padding:10px 12px;
  }
  .chooser-row input[type="checkbox"]{ width:16px; height:16px; }
  .step-indicator{ font-size:12px; color:var(--muted); margin-bottom:4px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; }
  .delete-link{ border:none; background:transparent; color:var(--danger); cursor:pointer; font-weight:700; font-size:13px; padding:8px 4px; }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="brand">
      <div class="mark">AB</div>
      <div class="brand-text">
        <h1>AthleteBoard</h1>
        <div class="sub">Baseball</div>
      </div>
    </div>
    <div class="controls">
      <button class="add-btn" id="openAddFlow">+ Add Player</button>
      <div class="tab-pills">
        <button class="tab-pill active" data-tab="batting">Batting</button>
        <button class="tab-pill" data-tab="pitching">Pitching</button>
        <button class="tab-pill" data-tab="fielding">Fielding</button>
      </div>
    </div>
  </header>

  <div class="toolbar">
    <div class="search-wrap">
      <span class="icon">&#128269;</span>
      <input id="searchInput" type="text" placeholder="Search players or schools" />
    </div>
    <div class="count" id="tabCount">0 players</div>
    <div class="actions">
      <button class="secondary" id="exportBtn">Export JSON</button>
      <button class="secondary" id="importBtn">Import JSON</button>
      <input id="importFile" type="file" accept="application/json" style="display:none" />
    </div>
  </div>

  <div class="card">
    <div id="tableArea"></div>
  </div>
</div>

<!-- Add Players Modal -->
<div class="modal-overlay" id="addOverlay">
  <div class="modal">
    <div class="modal-head">
      <div>
        <div class="step-indicator" id="addStepLabel">Step 1 of 2</div>
        <h2 id="addTitle">Add players from a team</h2>
        <div class="sub" id="addSub">Paste the team's baseball stats page URL.</div>
      </div>
      <button class="modal-close" data-close-add>&times;</button>
    </div>
    <div class="modal-body" id="addBody"></div>
    <div class="modal-foot" id="addFoot"></div>
  </div>
</div>

<!-- Player Detail Modal -->
<div class="modal-overlay" id="detailOverlay">
  <div class="modal">
    <div class="modal-head">
      <div>
        <h2 id="detailName">Player</h2>
        <div class="sub" id="detailSub"></div>
      </div>
      <button class="modal-close" data-close-detail>&times;</button>
    </div>
    <div class="modal-body" id="detailBody"></div>
    <div class="modal-foot">
      <button class="delete-link" id="detailDelete">Unfollow player</button>
      <button class="add-btn" id="detailSave">Save changes</button>
    </div>
  </div>
</div>

<script>
/* ---------- Config: stat columns per category (edit freely) ---------- */
const STAT_COLUMNS = {
  batting:  ["GP-GS","AVG","OBP","SLG","OPS","AB","H","2B","3B","HR","TB","R","RBI","BB","HBP","SO","BB:SO","SF","SH","GDP","SB-ATT"],
  pitching: ["ERA","W-L","APP-GS","IP","H","R","ER","BB","SO","2B","3B","HR","WP","HBP","BK","SFA","SHA"],
  fielding: ["FLD%","G-GS","PO","A","E","TC","DP","SBA","CSB","IP","PB","CI"]
};
const CATEGORY_LABEL = { batting:"Batting", pitching:"Pitching", fielding:"Fielding" };
const DEFAULT_SORT = { batting:"AVG", pitching:"ERA", fielding:"FLD%" };

/* Derived stats: computed from other fields rather than entered by hand.
   Each function receives the category's stat object and returns a display
   string. Sorting and rendering both read through getStatValue() below,
   so a derived column behaves like any other for click-to-sort. */
const DERIVED_STATS = {
  batting: {
    "BB:SO": stats => {
      const bb = parseFloat(stats.BB), hbp = parseFloat(stats.HBP), so = parseFloat(stats.SO);
      if(isNaN(bb) || isNaN(so) || so === 0) return "";
      const ratio = (bb + (isNaN(hbp) ? 0 : hbp)) / so;
      return ratio.toFixed(2);
    }
  }
};
function getStatValue(player, category, col){
  const derived = DERIVED_STATS[category] && DERIVED_STATS[category][col];
  return derived ? derived(player[category]) : player[category][col];
}

/* ---------- Storage ---------- */
const STORAGE_KEY = "athleteboard-v5";

function loadPlayers(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return seedPlayers();
    const parsed = JSON.parse(raw);
    return Array.isArray(parsed) ? parsed : seedPlayers();
  }catch{ return seedPlayers(); }
}
function savePlayers(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(players)); }

function emptyStatObject(category){
  const obj = {};
  STAT_COLUMNS[category].forEach(c => obj[c] = "");
  return obj;
}
function newPlayer(name, sourceUrl){
  return {
    id: crypto.randomUUID(),
    name,
    sourceUrl: sourceUrl || "",
    school: "",
    batting: emptyStatObject("batting"),
    pitching: emptyStatObject("pitching"),
    fielding: emptyStatObject("fielding")
  };
}

/* Dummy/placeholder players matching the reference screenshots.
   These are here purely so you can see the intended UI populated.
   Delete via Unfollow, or clear localStorage, before shipping — the
   product spec calls for starting empty in production. */
function seedPlayers(){
  const rows = [
    { name:"Mason Hart", school:"Vanderbilt", stats:{
      "GP-GS":"52-52","AVG":".372","OBP":".465","SLG":".663","OPS":"1.063","AB":"199","H":"74",
      "2B":"16","3B":"3","HR":"12","TB":"132","R":"47","RBI":"41","BB":"28","HBP":"7","SO":"31",
      "SF":"4","SH":"1","GDP":"3", "SB-ATT":"8-10" } },
    { name:"Eli Navarro", school:"LSU", stats:{
      "GP-GS":"55-54","AVG":".351","OBP":".446","SLG":".649","OPS":"1.013","AB":"205","H":"72",
      "2B":"14","3B":"1","HR":"15","TB":"133","R":"44","RBI":"42","BB":"31","HBP":"5","SO":"36",
      "SF":"3","SH":"0","GDP":"5", "SB-ATT":"3-4" } },
    { name:"Andrew Schmit", school:"Oregon", stats:{
      "GP-GS":"53-53","AVG":".335","OBP":".446","SLG":".660","OPS":".995","AB":"206","H":"69",
      "2B":"17","3B":"4","HR":"14","TB":"136","R":"49","RBI":"38","BB":"29","HBP":"9","SO":"39",
      "SF":"2","SH":"2","GDP":"2", "SB-ATT":"7-9" } },
    { name:"Brady Ebel", school:"North Carolina", stats:{
      "GP-GS":"56-56","AVG":".321","OBP":".415","SLG":".587","OPS":".980","AB":"218","H":"70",
      "2B":"15","3B":"2","HR":"13","TB":"128","R":"42","RBI":"45","BB":"30","HBP":"6","SO":"34",
      "SF":"5","SH":"0","GDP":"6", "SB-ATT":"2-3" } },
    { name:"Cam Foster", school:"Tennessee", stats:{
      "GP-GS":"51-50","AVG":".318","OBP":".402","SLG":".571","OPS":".946","AB":"198","H":"63",
      "2B":"13","3B":"2","HR":"11","TB":"113","R":"39","RBI":"36","BB":"25","HBP":"8","SO":"41",
      "SF":"3","SH":"1","GDP":"4", "SB-ATT":"5-7" } },
    { name:"Noah Williams", school:"Wake Forest", stats:{
      "GP-GS":"54-53","AVG":".309","OBP":".396","SLG":".546","OPS":".917","AB":"207","H":"64",
      "2B":"12","3B":"5","HR":"9","TB":"113","R":"46","RBI":"33","BB":"27","HBP":"4","SO":"37",
      "SF":"4","SH":"2","GDP":"2", "SB-ATT":"14-17" } }
  ];
  return rows.map(r => {
    const p = newPlayer(r.name);
    p.school = r.school;
    Object.keys(r.stats).forEach(col => { p.batting[col] = r.stats[col]; });
    return p;
  });
}

let players = loadPlayers();
let activeTab = "batting";
let sortCol = DEFAULT_SORT.batting;
let sortDir = "desc";
let searchQuery = "";

/* ---------- Roster "discovery" stub ----------
   In production this calls a small backend/serverless scraper that
   fetches the team stats page (e.g. SIDEARM-format sites) and parses
   the roster. Browsers can't reliably cross-origin-scrape athletics
   sites, so for this prototype the human fills in the names that the
   backend would otherwise have discovered. Swap this function's body
   for a real fetch() to your scraping service later — nothing else
   in the app needs to change.
------------------------------------------------ */
function fetchRosterFromUrl(url){
  return []; // placeholder — real implementation returns discovered names
}

/* ---------- Rendering: main table ---------- */
const tableArea = document.getElementById("tableArea");
const tabCount = document.getElementById("tabCount");

function getFilteredSorted(){
  let list = players.filter(p => {
    if(searchQuery){
      const q = searchQuery.toLowerCase();
      if(!p.name.toLowerCase().includes(q) && !p.school.toLowerCase().includes(q)) return false;
    }
    return true;
  });
  list = [...list].sort((a,b) => {
    let av, bv;
    if(sortCol === "__name__"){ av = a.name; bv = b.name; }
    else if(sortCol === "__school__"){ av = a.school; bv = b.school; }
    else { av = getStatValue(a, activeTab, sortCol); bv = getStatValue(b, activeTab, sortCol); }
    const an = parseFloat(av), bn = parseFloat(bv);
    let cmp;
    if(!isNaN(an) && !isNaN(bn) && av !== "" && bv !== ""){ cmp = an - bn; }
    else { cmp = String(av||"").localeCompare(String(bv||"")); }
    return sortDir === "asc" ? cmp : -cmp;
  });
  return list;
}

function renderTable(){
  tabCount.textContent = `${players.length} player${players.length===1?"":"s"}`;

  if(players.length === 0){
    tableArea.innerHTML = `
      <div class="empty-state">
        <div class="big">No players followed yet</div>
        <div>Add players from a college team's baseball stats page to start tracking them.</div>
        <button class="add-btn" onclick="document.getElementById('openAddFlow').click()">+ Add Player</button>
      </div>`;
    return;
  }

  const list = getFilteredSorted();
  const cols = STAT_COLUMNS[activeTab];

  function arrowFor(colKey){
    if(sortCol !== colKey) return "";
    return sortDir === "asc" ? '<span class="arrow">&uarr;</span>' : '<span class="arrow">&darr;</span>';
  }

  let html = `<div class="table-wrap"><table><thead><tr>
    <th data-col="__name__" class="${sortCol==='__name__'?'sorted':''}">Player${arrowFor('__name__')}</th>
    <th data-col="__school__" class="${sortCol==='__school__'?'sorted':''}">School${arrowFor('__school__')}</th>`;
  cols.forEach(c => html += `<th data-col="${c}" class="${sortCol===c?'sorted':''}">${c}${arrowFor(c)}</th>`);
  html += `<th class="no-sort">Actions</th></tr></thead><tbody>`;

  if(list.length === 0){
    html += `<tr><td colspan="${cols.length+3}" style="text-align:center;color:#64748b;padding:32px;">No players match.</td></tr>`;
  }

  list.forEach(p => {
    html += `<tr>
      <td class="name-cell"><a class="player-link" data-id="${p.id}">${escapeHtml(p.name)}</a></td>
      <td>${escapeHtml(p.school) || "&mdash;"}</td>`;
    cols.forEach(c => {
      const val = getStatValue(p, activeTab, c);
      const primary = c === sortCol ? ' class="stat-primary"' : '';
      html += `<td${primary}>${val === "" || val === undefined ? "&mdash;" : escapeHtml(String(val))}</td>`;
    });
    html += `<td><button class="unfollow-btn" data-unfollow-id="${p.id}">Unfollow</button></td>`;
    html += `</tr>`;
  });

  html += `</tbody></table></div>`;
  tableArea.innerHTML = html;

  tableArea.querySelectorAll(".player-link").forEach(link => {
    link.addEventListener("click", () => openDetail(link.dataset.id));
  });
  tableArea.querySelectorAll("th[data-col]").forEach(th => {
    th.addEventListener("click", () => {
      const col = th.dataset.col;
      if(sortCol === col){ sortDir = sortDir === "asc" ? "desc" : "asc"; }
      else { sortCol = col; sortDir = "desc"; }
      renderTable();
    });
  });
  tableArea.querySelectorAll("[data-unfollow-id]").forEach(btn => {
    btn.addEventListener("click", () => {
      players = players.filter(p => p.id !== btn.dataset.unfollowId);
      savePlayers();
      renderTable();
    });
  });
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[m]));
}

/* ---------- Search ---------- */
document.getElementById("searchInput").addEventListener("input", e => {
  searchQuery = e.target.value;
  renderTable();
});

/* ---------- Tabs ---------- */
document.querySelectorAll(".tab-pill").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab-pill").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    activeTab = tab.dataset.tab;
    sortCol = DEFAULT_SORT[activeTab];
    sortDir = "desc";
    renderTable();
  });
});

/* ---------- Add Players flow ---------- */
const addOverlay = document.getElementById("addOverlay");
const addBody = document.getElementById("addBody");
const addFoot = document.getElementById("addFoot");
const addStepLabel = document.getElementById("addStepLabel");
const addTitle = document.getElementById("addTitle");
const addSub = document.getElementById("addSub");

let pendingUrl = "";

function openAddFlowStep1(){
  pendingUrl = "";
  addStepLabel.textContent = "Step 1 of 2";
  addTitle.textContent = "Add players from a team";
  addSub.textContent = "Paste the team's baseball stats page URL.";
  addBody.innerHTML = `
    <div class="field">
      <label for="teamUrlInput">Team stats page URL</label>
      <input id="teamUrlInput" type="url" placeholder="https://merrimackathletics.com/sports/baseball/stats?path=baseball" />
      <div class="hint">Works best with SIDEARM Sports-hosted athletics sites. Support for other vendors can be added later.</div>
    </div>`;
  addFoot.innerHTML = `
    <button class="secondary" data-close-add>Cancel</button>
    <button class="add-btn" id="findPlayersBtn">Find Players</button>`;
  document.getElementById("findPlayersBtn").addEventListener("click", () => {
    const url = document.getElementById("teamUrlInput").value.trim();
    if(!url) return;
    pendingUrl = url;
    openAddFlowStep2(url);
  });
  addOverlay.classList.add("open");
}

function openAddFlowStep2(url){
  const discovered = fetchRosterFromUrl(url); // stub — see comment above

  addStepLabel.textContent = "Step 2 of 2";
  addTitle.textContent = "Choose Players";
  addSub.textContent = discovered.length
    ? "Select which players to follow."
    : "Automatic roster lookup isn't wired up yet in this prototype — type the player names to add.";

  if(discovered.length){
    addBody.innerHTML = `<div class="chooser-list">` +
      discovered.map(name => `
        <label class="chooser-row">
          <input type="checkbox" value="${escapeHtml(name)}" checked />
          ${escapeHtml(name)}
        </label>`).join("") +
      `</div>`;
    addFoot.innerHTML = `
      <button class="secondary" id="backToStep1">Back</button>
      <button class="add-btn" id="addSelectedBtn">Add Selected</button>`;
    document.getElementById("addSelectedBtn").addEventListener("click", () => {
      const checked = [...addBody.querySelectorAll('input[type="checkbox"]:checked')].map(cb => cb.value);
      checked.forEach(name => players.push(newPlayer(name, pendingUrl)));
      savePlayers();
      renderTable();
      closeAdd();
    });
  } else {
    addBody.innerHTML = `
      <div class="field">
        <label for="manualNames">Player names</label>
        <textarea id="manualNames" rows="4" placeholder="One name per line, e.g.&#10;Andrew Schmit&#10;Jake Donovan"></textarea>
        <div class="hint">You'll be able to fill in each player's stats after adding them.</div>
      </div>`;
    addFoot.innerHTML = `
      <button class="secondary" id="backToStep1">Back</button>
      <button class="add-btn" id="addManualBtn">Add Players</button>`;
    document.getElementById("addManualBtn").addEventListener("click", () => {
      const names = document.getElementById("manualNames").value
        .split("\n").map(s => s.trim()).filter(Boolean);
      if(!names.length) return;
      names.forEach(name => players.push(newPlayer(name, pendingUrl)));
      savePlayers();
      renderTable();
      closeAdd();
    });
  }

  document.getElementById("backToStep1").addEventListener("click", openAddFlowStep1);
}

function closeAdd(){ addOverlay.classList.remove("open"); }

document.getElementById("openAddFlow").addEventListener("click", openAddFlowStep1);
addOverlay.addEventListener("click", e => { if(e.target === addOverlay) closeAdd(); });
document.querySelectorAll("[data-close-add]").forEach(b => b.addEventListener("click", closeAdd));

/* ---------- Player detail modal ---------- */
const detailOverlay = document.getElementById("detailOverlay");
const detailName = document.getElementById("detailName");
const detailSub = document.getElementById("detailSub");
const detailBody = document.getElementById("detailBody");
const detailDelete = document.getElementById("detailDelete");
const detailSave = document.getElementById("detailSave");

let currentDetailId = null;

function openDetail(id){
  currentDetailId = id;
  const p = players.find(pl => pl.id === id);
  if(!p) return;

  detailName.textContent = p.name;
  detailSub.textContent = p.school || "";

  let html = `
    <div class="field">
      <label>School</label>
      <input id="editSchool" type="text" value="${escapeHtml(p.school)}" />
    </div>
    <div class="field">
      <label>Stats source URL</label>
      <input id="editSourceUrl" type="url" value="${escapeHtml(p.sourceUrl)}" />
    </div>`;

  Object.keys(STAT_COLUMNS).forEach(category => {
    html += `<div class="stat-section"><h3>${CATEGORY_LABEL[category]}</h3><div class="stat-grid">`;
    STAT_COLUMNS[category].forEach(col => {
      const isDerived = DERIVED_STATS[category] && DERIVED_STATS[category][col];
      if(isDerived){
        html += `
          <div class="stat-field field">
            <label>${col} (auto)</label>
            <input type="text" value="${escapeHtml(getStatValue(p, category, col) || '—')}" disabled style="background:#f8fafc;color:#94a3b8;" />
          </div>`;
      } else {
        html += `
          <div class="stat-field field">
            <label>${col}</label>
            <input data-cat="${category}" data-col="${col}" type="text" value="${escapeHtml(p[category][col] ?? "")}" />
          </div>`;
      }
    });
    html += `</div></div>`;
  });

  detailBody.innerHTML = html;
  detailOverlay.classList.add("open");
}

function closeDetail(){ detailOverlay.classList.remove("open"); currentDetailId = null; }

detailSave.addEventListener("click", () => {
  const p = players.find(pl => pl.id === currentDetailId);
  if(!p) return;
  p.school = document.getElementById("editSchool").value.trim();
  p.sourceUrl = document.getElementById("editSourceUrl").value.trim();
  detailBody.querySelectorAll("input[data-cat]").forEach(input => {
    p[input.dataset.cat][input.dataset.col] = input.value.trim();
  });
  savePlayers();
  renderTable();
  closeDetail();
});

detailDelete.addEventListener("click", () => {
  players = players.filter(pl => pl.id !== currentDetailId);
  savePlayers();
  renderTable();
  closeDetail();
});

detailOverlay.addEventListener("click", e => { if(e.target === detailOverlay) closeDetail(); });
document.querySelectorAll("[data-close-detail]").forEach(b => b.addEventListener("click", closeDetail));

/* ---------- Export / Import ---------- */
document.getElementById("exportBtn").addEventListener("click", () => {
  const blob = new Blob([JSON.stringify(players, null, 2)], { type:"application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "athleteboard-data.json";
  a.click();
  URL.revokeObjectURL(a.href);
});

const importBtn = document.getElementById("importBtn");
const importFile = document.getElementById("importFile");
importBtn.addEventListener("click", () => importFile.click());
importFile.addEventListener("change", async e => {
  const file = e.target.files[0];
  if(!file) return;
  try{
    const parsed = JSON.parse(await file.text());
    if(!Array.isArray(parsed)) throw new Error("Invalid file");
    players = parsed.map(p => ({
      id: p.id || crypto.randomUUID(),
      name: p.name || "Unnamed",
      sourceUrl: p.sourceUrl || "",
      school: p.school || "",
      batting: { ...emptyStatObject("batting"), ...(p.batting||{}) },
      pitching: { ...emptyStatObject("pitching"), ...(p.pitching||{}) },
      fielding: { ...emptyStatObject("fielding"), ...(p.fielding||{}) }
    }));
    savePlayers();
    renderTable();
  }catch{
    alert("That file could not be imported.");
  }finally{
    e.target.value = "";
  }
});

/* ---------- Init ---------- */
renderTable();
</script>
</body>
</html>
